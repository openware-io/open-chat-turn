apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-chat-turn
  namespace: im-business
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-chat-turn
  template:
    metadata:
      labels:
        app: open-chat-turn
    spec:
      containers:
        - name: turn
          # Replace the registry/repository for your release image.
          image: registry.example.com/openware/open-chat-turn:1.0.0
          imagePullPolicy: IfNotPresent
          resources:
            # Baseline for one TURN replica; tune from relay-session traffic.
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          ports:
            - name: turn-udp
              containerPort: 3478
              protocol: UDP
          envFrom:
            - configMapRef:
                name: open-chat-turn-config
            - secretRef:
                name: open-chat-turn-credentials
      imagePullSecrets:
        - name: acr-public-key
---
apiVersion: v1
kind: Service
metadata:
  name: open-chat-turn
  namespace: im-business
  annotations:
    service.beta.kubernetes.io/alicloud-loadbalancer-address-type: internet
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: open-chat-turn
  ports:
